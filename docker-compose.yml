services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      AMQP_URL: "amqp://app:app@rabbitmq:5672/"
      BROKER_URL: "amqp://app:app@rabbitmq:5672/"
      CACHE_URL: "redis://redis:6379/1"
      CELERY_BROKER_URL: "amqp://app:app@rabbitmq:5672/"
      DATABASE_URL: "postgres://app:app@postgres:5432/app?sslmode=disable"
      DB_HOST: "postgres"
      DB_NAME: "app"
      DB_PASSWORD: "app"
      DB_PORT: "5432"
      DB_USER: "app"
      DB_USERNAME: "app"
      MYSQL_URL: "mysql://app:app@mysql:3306/app"
      PORT: "8080"
      POSTGRES_URL: "postgres://app:app@postgres:5432/app?sslmode=disable"
      RABBITMQ_URL: "amqp://app:app@rabbitmq:5672/"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: "app"
      MYSQL_DATABASE: "app"
      MYSQL_USER: "app"
      MYSQL_PASSWORD: "app"
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uapp -papp"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "app"
      POSTGRES_PASSWORD: "app"
      POSTGRES_DB: "app"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "app"
      RABBITMQ_DEFAULT_PASS: "app"
    expose:
      - "5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
  postgres-data:
